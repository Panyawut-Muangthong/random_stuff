<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Quest - เกมจับสัตว์เลี้ยงมินิมอล</title>
  <style>
    /* Reset & Base Fonts */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      touch-action: manipulation;
    }

    /* Main Console / Container */
    .game-container {
      width: 100%;
      max-width: 480px;
      background: #111827;
      border: 3px solid #374151;
      border-radius: 10px;
      box-shadow: 6px 6px 0px #030712;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header Bar: Status & Money */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border: 2px solid #374151;
      background-color: #1f2937;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #e5e7eb;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-money {
      color: #fbbf24;
      background: #3b2506;
      padding: 2px 8px;
      border: 1.5px solid #d97706;
      border-radius: 4px;
      font-weight: 800;
    }

    /* Screen Area */
    .screen-area {
      border: 2px solid #374151;
      border-radius: 6px;
      padding: 16px;
      min-height: 175px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #151d2f;
      text-align: center;
    }

    .screen-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      color: #f9fafb;
    }

    .content-box {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #9ca3af;
      padding: 12px;
      background-color: #0e1524;
      border: 1.5px dashed #4b5563;
      border-radius: 6px;
    }

    /* Message Alert / Feedback */
    .alert-banner {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .alert-banner.success {
      background-color: #064e3b;
      color: #a7f3d0;
      border: 1px solid #059669;
    }
    .alert-banner.error {
      background-color: #7f1d1d;
      color: #fecaca;
      border: 1px solid #dc2626;
    }

    /* Action & Menu Groups */
    .view-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Button Styling */
    .btn {
      width: 100%;
      padding: 13px 16px;
      font-size: 1rem;
      font-weight: 700;
      color: #f3f4f6;
      background-color: #1f2937;
      border: 2px solid #374151;
      border-radius: 6px;
      box-shadow: 3px 3px 0px #030712;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.05s ease, box-shadow 0.05s ease, background-color 0.1s;
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      background-color: #283548;
      border-color: #4b5563;
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #030712;
    }

    .btn:disabled {
      background-color: #131924;
      color: #4b5563;
      border-color: #27303f;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-secondary {
      text-align: center;
      justify-content: center;
      background-color: #1a2233;
      border-color: #374151;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #242f46;
    }

    .btn-tag {
      font-size: 0.8rem;
      font-weight: normal;
      background-color: #0b1120;
      color: #64748b;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }

    /* Shop Item Details */
    .shop-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }

    .shop-item-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: #f9fafb;
    }

    .shop-item-sub {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: normal;
    }

    .shop-price-tag {
      background-color: #3b2506;
      color: #fbbf24;
      border: 1.5px solid #d97706;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 800;
      white-space: nowrap;
    }

    /* Pet Inventory List */
    .inventory-scroll {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 290px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .inventory-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .inventory-scroll::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }

    .pet-card {
      background-color: #151d2f;
      border: 2px solid #374151;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 2px 2px 0px #030712;
    }

    .pet-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }

    .pet-name-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.98rem;
      font-weight: 800;
      color: #f9fafb;
    }

    .pet-stat-line {
      font-size: 0.85rem;
      color: #9ca3af;
      line-height: 1.45;
    }

    .pet-action-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .btn-feed {
      background-color: #065f46;
      color: #d1fae5;
      border: 1.5px solid #10b981;
      border-radius: 4px;
      padding: 6px 11px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 2px 2px 0px #030712;
      transition: transform 0.05s ease, background-color 0.1s;
    }

    .btn-feed:hover {
      background-color: #047857;
      color: #ffffff;
    }

    .btn-feed:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #030712;
    }

    .btn-sell {
      background-color: #7f1d1d;
      color: #fecaca;
      border: 1.5px solid #b91c1c;
      border-radius: 4px;
      padding: 6px 11px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 2px 2px 0px #030712;
      transition: transform 0.05s ease, background-color 0.1s;
    }

    .btn-sell:hover {
      background-color: #991b1b;
      color: #ffffff;
    }

    .btn-sell:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #030712;
    }

    .btn-choose-champ {
      background-color: #7c2d12;
      color: #ffedd5;
      border: 1.5px solid #ea580c;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 2px 2px 0px #030712;
    }

    .btn-choose-champ:hover {
      background-color: #9a3412;
    }

    /* Wild Encounter & Catch Area Styling */
    .ball-summary-bar {
      display: flex;
      justify-content: space-between;
      background-color: #0e1524;
      border: 1.5px solid #374151;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.84rem;
      color: #94a3b8;
    }

    .ball-summary-bar span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ball-count-val {
      color: #38bdf8;
      font-weight: 800;
    }

    .btn-catch-action {
      background-color: #1e3a8a;
      border-color: #3b82f6;
    }

    .btn-catch-action:hover:not(:disabled) {
      background-color: #1d4ed8;
      border-color: #60a5fa;
    }

    .btn-search-wild {
      background-color: #064e3b;
      border-color: #059669;
      text-align: center;
      justify-content: center;
      font-size: 1.05rem;
    }

    .btn-search-wild:hover:not(:disabled) {
      background-color: #047857;
    }

    /* Matchmaking & Duel Box Styling */
    .matchmaking-card {
      background-color: #0e1524;
      border: 2px dashed #3b82f6;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .pulse-text {
      color: #60a5fa;
      font-weight: 800;
      font-size: 1.05rem;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .vs-match-card {
      background-color: #1a2338;
      border: 2px solid #ea580c;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
    }

    .vs-duelists {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 0;
    }

    .duelist-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      text-align: center;
    }

    .duelist-trainer {
      font-size: 0.85rem;
      color: #f97316;
      font-weight: 800;
    }

    .duelist-pet {
      font-size: 0.95rem;
      color: #f3f4f6;
      font-weight: 700;
    }

    .vs-badge {
      font-size: 1.25rem;
      font-weight: 900;
      color: #f97316;
      padding: 0 8px;
    }

    .btn-arena-start {
      background-color: #991b1b;
      border-color: #ef4444;
      text-align: center;
      justify-content: center;
      font-size: 1.05rem;
    }

    .btn-arena-start:hover:not(:disabled) {
      background-color: #b91c1c;
    }

    /* Footer / Back Button */
    .footer-bar {
      margin-top: 2px;
    }

    /* Mobile Fullscreen (แสดงผลเต็มจอเมื่อเปิดบนมือถือ) */
    @media (max-width: 600px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .game-container {
        max-width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
        padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px));
        justify-content: space-between;
        gap: 12px;
      }

      .screen-area {
        flex: 1;
        min-height: 140px;
      }

      .inventory-scroll {
        max-height: 48vh;
      }

      .btn {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- แถบสถานะข้อมูลผู้เล่น -->
    <header class="status-bar">
      <div class="status-item">
        <span>กระเป๋า:</span>
        <span id="ball-count">บอล: 0</span> |
        <span id="food-count">อาหาร: 0</span>
      </div>
      <div class="status-item">
        <span>เหรียญ:</span>
        <span class="badge-money" id="player-money">1,000 G</span>
      </div>
    </header>

    <!-- พื้นที่หน้าจอแสดงผลตามเมนู -->
    <main class="screen-area" id="screen-display">
      <div class="screen-title" id="screen-title">หน้าหลัก</div>
      <div class="content-box" id="screen-message">
        ยินดีต้อนรับสู่ Monster Quest!<br>
        กรุณาเลือกเมนูที่ต้องการทำรายการ
      </div>
      <div id="alert-box"></div>
    </main>

    <!-- เมนูหลัก 5 ปุ่ม -->
    <nav class="view-panel" id="panel-main">
      <button class="btn" id="btn-shop" onclick="openMenu('shop')">
        <span>1. ร้านค้า</span>
        <span>&rarr;</span>
      </button>

      <button class="btn" id="btn-petshop" onclick="openMenu('petshop')">
        <span>2. ร้านสัตว์เลี้ยง</span>
        <span>&rarr;</span>
      </button>

      <button class="btn" id="btn-inventory" onclick="openMenu('inventory')">
        <span>3. คลังสัตว์เลี้ยง</span>
        <span id="pet-count-badge" class="btn-tag">0 ตัว</span>
      </button>

      <button class="btn" id="btn-catch" onclick="openMenu('catch')">
        <span>4. สถานที่จับสัตว์เลี้ยง</span>
        <span>&rarr;</span>
      </button>

      <button class="btn" id="btn-arena" onclick="openMenu('arena')">
        <span>5. ลานประลอง (สู้ผู้เล่นจริง)</span>
        <span>&rarr;</span>
      </button>
    </nav>

    <!-- หน้าเมนูย่อย: ร้านค้า (ปุ่มที่ 1) -->
    <section class="view-panel" id="panel-shop" style="display: none;">
      <button class="btn" onclick="buyItem('pokeball')">
        <div class="shop-item-info">
          <span class="shop-item-name">Pokeball ธรรมดา</span>
          <span class="shop-item-sub" id="shop-stock-pokeball">ในกระเป๋า: 0 ลูก</span>
        </div>
        <span class="shop-price-tag">100 G</span>
      </button>

      <button class="btn" onclick="buyItem('greatball')">
        <div class="shop-item-info">
          <span class="shop-item-name">Great Ball</span>
          <span class="shop-item-sub" id="shop-stock-greatball">ในกระเป๋า: 0 ลูก</span>
        </div>
        <span class="shop-price-tag">300 G</span>
      </button>

      <button class="btn" onclick="buyItem('ultraball')">
        <div class="shop-item-info">
          <span class="shop-item-name">Ultra Ball</span>
          <span class="shop-item-sub" id="shop-stock-ultraball">ในกระเป๋า: 0 ลูก</span>
        </div>
        <span class="shop-price-tag">800 G</span>
      </button>
    </section>

    <!-- หน้าเมนูย่อย: ร้านสัตว์เลี้ยง (ปุ่มที่ 2) -->
    <section class="view-panel" id="panel-petshop" style="display: none;">
      <div class="inventory-scroll">
        <button class="btn" onclick="buyPetFood('food_fire')">
          <div class="shop-item-info">
            <span class="shop-item-name">🔥 อาหารธาตุไฟ</span>
            <span class="shop-item-sub" id="stock-food_fire">ในกระเป๋า: 0 ชิ้น</span>
          </div>
          <span class="shop-price-tag">80 G</span>
        </button>

        <button class="btn" onclick="buyPetFood('food_water')">
          <div class="shop-item-info">
            <span class="shop-item-name">💧 อาหารธาตุน้ำ</span>
            <span class="shop-item-sub" id="stock-food_water">ในกระเป๋า: 0 ชิ้น</span>
          </div>
          <span class="shop-price-tag">80 G</span>
        </button>

        <button class="btn" onclick="buyPetFood('food_grass')">
          <div class="shop-item-info">
            <span class="shop-item-name">🌿 อาหารธาตุพืช</span>
            <span class="shop-item-sub" id="stock-food_grass">ในกระเป๋า: 0 ชิ้น</span>
          </div>
          <span class="shop-price-tag">80 G</span>
        </button>

        <button class="btn" onclick="buyPetFood('food_electric')">
          <div class="shop-item-info">
            <span class="shop-item-name">⚡ อาหารธาตุไฟฟ้า</span>
            <span class="shop-item-sub" id="stock-food_electric">ในกระเป๋า: 0 ชิ้น</span>
          </div>
          <span class="shop-price-tag">100 G</span>
        </button>

        <button class="btn" onclick="buyPetFood('food_rock')">
          <div class="shop-item-info">
            <span class="shop-item-name">🪨 อาหารธาตุหิน</span>
            <span class="shop-item-sub" id="stock-food_rock">ในกระเป๋า: 0 ชิ้น</span>
          </div>
          <span class="shop-price-tag">80 G</span>
        </button>
      </div>
    </section>

    <!-- หน้าเมนูย่อย: คลังสัตว์เลี้ยง (ปุ่มที่ 3) -->
    <section class="view-panel" id="panel-inventory" style="display: none;">
      <div class="inventory-scroll" id="inventory-list">
        <!-- รายการสัตว์เลี้ยงถูกสร้างแบบไดนามิกจาก JavaScript -->
      </div>
    </section>

    <!-- หน้าเมนูย่อย: สถานที่จับสัตว์เลี้ยง (ปุ่มที่ 4) -->
    <section class="view-panel" id="panel-catch" style="display: none;">
      <div class="ball-summary-bar">
        <span>Pokeball: <b class="ball-count-val" id="catch-count-poke">0</b></span>
        <span>Great Ball: <b class="ball-count-val" id="catch-count-great">0</b></span>
        <span>Ultra Ball: <b class="ball-count-val" id="catch-count-ultra">0</b></span>
      </div>

      <div id="catch-interactive-area" class="view-panel">
        <!-- แสดงผลหน้าเลือกโซน หรือ หน้าสุ่มจับในโซนแบบไดนามิก -->
      </div>
    </section>

    <!-- หน้าเมนูย่อย: ลานประลอง (ปุ่มที่ 5) -->
    <section class="view-panel" id="panel-arena" style="display: none;">
      <div id="arena-interactive-area" class="view-panel">
        <!-- ควบคุมด้วย JavaScript สำหรับเลือกตัวแทน / Matchmaking / สรุปผล -->
      </div>
    </section>

    <!-- เมนูย้อนกลับ -->
    <footer class="footer-bar">
      <button class="btn btn-secondary" id="btn-back" onclick="goBack()" disabled>
        ย้อนกลับ
      </button>
    </footer>
  </div>

  <script>
    // --- การตั้งค่าและคีย์ localStorage ---
    const STORAGE_KEY_PLAYER = 'monster_quest_player_data';
    const STORAGE_KEY_PETS = 'monster_quest_pet_inventory';

    // รายการสินค้าในร้านค้า Pokeball (เมนู 1)
    const SHOP_ITEMS = {
      pokeball: { name: 'Pokeball ธรรมดา', price: 100 },
      greatball: { name: 'Great Ball', price: 300 },
      ultraball: { name: 'Ultra Ball', price: 800 }
    };

    // รายการอาหารตามธาตุในร้านสัตว์เลี้ยง (เมนู 2)
    const PET_FOODS = {
      food_fire: { key: 'food_fire', name: 'อาหารธาตุไฟ', element: 'ไฟ', price: 80, icon: '🔥' },
      food_water: { key: 'food_water', name: 'อาหารธาตุน้ำ', element: 'น้ำ', price: 80, icon: '💧' },
      food_grass: { key: 'food_grass', name: 'อาหารธาตุพืช', element: 'พืช', price: 80, icon: '🌿' },
      food_electric: { key: 'food_electric', name: 'อาหารธาตุไฟฟ้า', element: 'ไฟฟ้า', price: 100, icon: '⚡' },
      food_rock: { key: 'food_rock', name: 'อาหารธาตุหิน', element: 'หิน', price: 80, icon: '🪨' }
    };

    // แผนที่จับคู่ชื่อธาตุกับคีย์ของอาหาร
    const ELEMENT_TO_FOOD_KEY = {
      'ไฟ': 'food_fire',
      'น้ำ': 'food_water',
      'พืช': 'food_grass',
      'ไฟฟ้า': 'food_electric',
      'หิน': 'food_rock'
    };

    // ฐานข้อมูลโซนสถานที่จับสัตว์เลี้ยง 4 โซน (เมนู 4)
    const CATCH_ZONES = {
      grassland: {
        id: 'grassland',
        name: 'โซนที่ 1: ทุ่งหญ้าเริ่มต้น (Lv. 1 - 5)',
        shortName: 'ทุ่งหญ้าเริ่มต้น',
        icon: '🌱',
        levelMin: 1,
        levelMax: 5,
        badgeText: 'Lv. 1 - 5',
        desc: 'ทุ่งหญ้ากว้างสำหรับผู้เริ่มต้น โปเกมอนเชื่องและจับง่าย',
        elements: ['พืช', 'น้ำ'],

    // ธาตุและจุดอ่อน

    // ตัวแปรสถานะเกม

    // --- ฟังก์ชันบันทึกและโหลดข้อมูล (localStorage) ---
    function saveGame() {
      try {
        localStorage.setItem(STORAGE_KEY_PLAYER, JSON.stringify(playerData));
        localStorage.setItem(STORAGE_KEY_PETS, JSON.stringify(petInventory));
      } catch (err) {
        console.error('ไม่สามารถบันทึกข้อมูลลง localStorage ได้:', err);
      }
    }

    function loadGame() {
      try {
        const savedPlayer = localStorage.getItem(STORAGE_KEY_PLAYER);
        const savedPets = localStorage.getItem(STORAGE_KEY_PETS);

        if (savedPlayer) {
          playerData = JSON.parse(savedPlayer);
          if (!playerData.inventory) {
            playerData.inventory = { ...defaultPlayerData.inventory };
          } else {
            Object.keys(defaultPlayerData.inventory).forEach(k => {
              if (typeof playerData.inventory[k] !== 'number') {
                playerData.inventory[k] = defaultPlayerData.inventory[k];
              }
            });
          }
        } else {
          playerData = JSON.parse(JSON.stringify(defaultPlayerData));
        }

        if (savedPets) {
          petInventory = JSON.parse(savedPets);
        } else {
          petInventory = JSON.parse(JSON.stringify(defaultPetInventory));
        }
      } catch (err) {
        console.warn('เกิดข้อผิดพลาดในการโหลดข้อมูล กำลังรีเซ็ตเป็นค่าเริ่มต้น:', err);
        playerData = JSON.parse(JSON.stringify(defaultPlayerData));
        petInventory = JSON.parse(JSON.stringify(defaultPetInventory));
      }

      saveGame();
      updateUI();
    }

    // --- ฟังก์ชันอัปเดต UI หลัก ---
    function updateUI() {
      const inv = playerData.inventory || {};
      const totalBalls = (inv.pokeball || 0) + (inv.greatball || 0) + (inv.ultraball || 0);
      const totalFoods = (inv.food_fire || 0) + (inv.food_water || 0) + (inv.food_grass || 0) +
                         (inv.food_electric || 0) + (inv.food_rock || 0);

      document.getElementById('player-money').textContent = `${playerData.money.toLocaleString()} G`;
      document.getElementById('ball-count').textContent = `บอล: ${totalBalls}`;
      document.getElementById('food-count').textContent = `อาหาร: ${totalFoods}`;
      document.getElementById('pet-count-badge').textContent = `${petInventory.length} ตัว`;

      const catchPoke = document.getElementById('catch-count-poke');
      const catchGreat = document.getElementById('catch-count-great');
      const catchUltra = document.getElementById('catch-count-ultra');
      if (catchPoke) catchPoke.textContent = inv.pokeball || 0;
      if (catchGreat) catchGreat.textContent = inv.greatball || 0;
      if (catchUltra) catchUltra.textContent = inv.ultraball || 0;

      document.getElementById('btn-back').disabled = (currentScreen === 'main');
    }

    function showAlert(text, type = 'success') {
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = `<div class="alert-banner ${type}">${text}</div>`;
      setTimeout(() => {
        if (alertBox.innerHTML.includes(text)) {
          alertBox.innerHTML = '';
        }
      }, 3500);
    }

    // --- ฟังก์ชันร้านค้า Pokeball (ปุ่มที่ 1) ---
    function renderShop() {
      const inv = playerData.inventory || {};
      document.getElementById('shop-stock-pokeball').textContent = `ในกระเป๋า: ${inv.pokeball || 0} ลูก`;
      document.getElementById('shop-stock-greatball').textContent = `ในกระเป๋า: ${inv.greatball || 0} ลูก`;
      document.getElementById('shop-stock-ultraball').textContent = `ในกระเป๋า: ${inv.ultraball || 0} ลูก`;
    }

    function buyItem(itemKey) {
      const item = SHOP_ITEMS[itemKey];
      if (!item) return;

      if (playerData.money < item.price) {
        showAlert(`เงินไม่พอสำหรับซื้อ ${item.name}! (ต้องการ ${item.price} G)`, 'error');
        return;
      }

      playerData.money -= item.price;
      playerData.inventory[itemKey] = (playerData.inventory[itemKey] || 0) + 1;

      saveGame();
      updateUI();
      renderShop();
      showAlert(`ซื้อ ${item.name} สำเร็จ! (-${item.price} G)`, 'success');
    }

    // --- ฟังก์ชันร้านสัตว์เลี้ยง (ปุ่มที่ 2) ---
    function renderPetShop() {
      const inv = playerData.inventory || {};
      Object.keys(PET_FOODS).forEach(key => {
        const span = document.getElementById(`stock-${key}`);
        if (span) {
          span.textContent = `ในกระเป๋า: ${inv[key] || 0} ชิ้น`;
        }
      });
    }

    function buyPetFood(foodKey) {
      const food = PET_FOODS[foodKey];
      if (!food) return;

      if (playerData.money < food.price) {
        showAlert(`เงินไม่พอสำหรับซื้อ ${food.name}! (ต้องการ ${food.price} G)`, 'error');
        return;
      }

      playerData.money -= food.price;
      playerData.inventory[foodKey] = (playerData.inventory[foodKey] || 0) + 1;

      saveGame();
      updateUI();
      renderPetShop();
      showAlert(`ซื้อ ${food.name} สำเร็จ! (-${food.price} G)`, 'success');
    }

    // --- ฟังก์ชันคลังสัตว์เลี้ยง & การให้อาหาร (ปุ่มที่ 3) ---
    function renderInventory() {
      const listContainer = document.getElementById('inventory-list');
      listContainer.innerHTML = '';

      if (petInventory.length === 0) {
        listContainer.innerHTML = `
          <div class="content-box">
            ไม่มีสัตว์เลี้ยงอยู่ในคลังขณะนี้<br>
            คุณสามารถไปจับสัตว์เลี้ยงได้ที่ "สถานที่จับสัตว์เลี้ยง"
          </div>
        `;
        return;
      }

      const inv = playerData.inventory || {};

      petInventory.forEach((pet, index) => {
        const sellPrice = pet.sellPrice || (pet.level * 40 + 60);
        const foodKey = ELEMENT_TO_FOOD_KEY[pet.element];
        const foodInfo = PET_FOODS[foodKey];
        const foodCount = foodKey ? (inv[foodKey] || 0) : 0;

        const card = document.createElement('div');
        card.className = 'pet-card';
        card.innerHTML = `
          <div class="pet-info">
            <div class="pet-name-line">
              <span>${pet.name || 'มอนสเตอร์'}</span>
              <span class="btn-tag">ธาตุ${pet.element}</span>
            </div>
            <div class="pet-stat-line">
              เลเวล: ${pet.level}, ธาตุ: ${pet.element}, ATK: ${pet.atk}, HP: ${pet.hp}, แพ้ทาง: ${pet.weakness}
            </div>
          </div>
          <div class="pet-action-row">
            <button class="btn-feed" onclick="feedPet(${index})">
              ${foodInfo ? foodInfo.icon : '🍽️'} ให้อาหารธาตุ${pet.element} (${foodCount} ชิ้น)
            </button>
            <button class="btn-sell" onclick="sellPet(${index})">
              ขาย (${sellPrice} G)
            </button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function feedPet(index) {
      if (index < 0 || index >= petInventory.length) return;

      const pet = petInventory[index];
      const foodKey = ELEMENT_TO_FOOD_KEY[pet.element];
      const foodInfo = PET_FOODS[foodKey];

      if (!foodInfo) {
        showAlert(`ไม่พบชนิดอาหารสำหรับสัตว์เลี้ยงธาตุ ${pet.element}`, 'error');
        return;
      }

      const currentFood = (playerData.inventory && playerData.inventory[foodKey]) || 0;
      if (currentFood <= 0) {
        showAlert(`ไม่มี "${foodInfo.name}" ในกระเป๋า! ไปซื้อได้ที่ร้านสัตว์เลี้ยง`, 'error');
        return;
      }

      playerData.inventory[foodKey]--;
      pet.level += 1;

      const atkGain = Math.floor(Math.random() * 3) + 4;
      const hpGain = Math.floor(Math.random() * 5) + 8;
      pet.atk += atkGain;
      pet.hp += hpGain;
      pet.sellPrice = pet.level * 40 + 60;

      saveGame();
      updateUI();
      renderInventory();

      showAlert(`✨ เลเวลอัป! ${pet.name} ก้าวสู่ Lv.${pet.level} (ATK +${atkGain}, HP +${hpGain}, ราคาขาย +40 G)`, 'success');
    }

    function sellPet(index) {
      if (index < 0 || index >= petInventory.length) return;

      const pet = petInventory[index];
      const sellPrice = pet.sellPrice || (pet.level * 40 + 60);
      const petName = pet.name || 'มอนสเตอร์';

      if (selectedChampionId === pet.id) {
        selectedChampionId = null;
      }

      petInventory.splice(index, 1);
      playerData.money += sellPrice;

      saveGame();
      updateUI();
      renderInventory();
      showAlert(`ขาย ${petName} สำเร็จ! ได้รับ +${sellPrice} G`, 'success');
    }

    // --- ฟังก์ชันสถานที่จับสัตว์เลี้ยง (ปุ่มที่ 4 - ระบบเลือกโซน 4 ระดับ) ---

    function selectCatchZone(zoneId) {
      currentCatchZone = zoneId;
      wildPokemon = null;
      renderCatchScreen();
    }

    function returnToZoneSelection() {
      currentCatchZone = null;
      wildPokemon = null;
      renderCatchScreen();
    }

    // สุ่มหาโปเกมอนป่าตามช่วงเลเวลและสเตตัสที่สอดคล้องกับโซน
    function searchWildPokemonInZone() {
      if (!currentCatchZone) return;
      const zone = CATCH_ZONES[currentCatchZone];

      // สุ่มเลเวลในช่วงของโซนนั้น
      const level = Math.floor(Math.random() * (zone.levelMax - zone.levelMin + 1)) + zone.levelMin;

      // สุ่มชื่อและธาตุ
      const randomName = zone.names[Math.floor(Math.random() * zone.names.length)];
      const randomElement = zone.elements[Math.floor(Math.random() * zone.elements.length)];
      const weakness = ELEMENT_WEAKNESS[randomElement] || 'น้ำ';

      // คำนวณสเตตัสให้สเกลตามเลเวลของโซนอย่างสมดุล
      const atk = level * 5 + Math.floor(Math.random() * 8) + 12;
      const hp = level * 8 + Math.floor(Math.random() * 12) + 25;
      const sellPrice = level * 40 + 80;

      wildPokemon = {
        id: Date.now(),
        name: randomName,
        level: level,
        element: randomElement,
        atk: atk,
        hp: hp,
        weakness: weakness,
        sellPrice: sellPrice,
        zoneName: zone.name
      };

      const msg = `คุณเจอ <strong>${wildPokemon.name} Lv.${wildPokemon.level}!</strong><br>ธาตุ: ${wildPokemon.element} | ATK: ${wildPokemon.atk} | HP: ${wildPokemon.hp}`;
      renderCatchScreen(msg);
    }

    // โยนบอลจับสัตว์เลี้ยง (คำนวณ Catch Rate สมดุลรองรับ Lv. 1 - 50+)
    function throwBall(ballType) {
      if (!wildPokemon) return;

      const inv = playerData.inventory || {};
      const currentBalls = inv[ballType] || 0;

      if (currentBalls <= 0) {
        showAlert('คุณไม่มี Pokeball ชนิดนี้เหลืออยู่ในกระเป๋า!', 'error');
        return;
      }

      inv[ballType]--;
      playerData.inventory = inv;

      // Base catch rate คำนวณตามสัดส่วนเลเวล (Lv.1: 88%, Lv.50: 18%)
      const baseCatchRate = Math.max(15, Math.round(90 - ((wildPokemon.level - 1) / 49) * 72));
      let ballBonus = 0;
      let ballName = 'Pokeball';

      if (ballType === 'pokeball') {
        ballBonus = 0;
        ballName = 'Pokeball ธรรมดา';
      } else if (ballType === 'greatball') {
        ballBonus = 22;
        ballName = 'Great Ball';
      } else if (ballType === 'ultraball') {
        ballBonus = 45;
        ballName = 'Ultra Ball';
      }

      const totalRate = Math.min(95, Math.max(6, baseCatchRate + ballBonus));
      const roll = Math.random() * 100;

      if (roll <= totalRate) {
        // จับสำเร็จ
        const caughtPet = { ...wildPokemon };
        petInventory.push(caughtPet);

        saveGame();
        updateUI();

        const caughtName = caughtPet.name;
        const caughtLevel = caughtPet.level;
        wildPokemon = null;

        renderCatchScreen(
          `🎉 <strong>จับสำเร็จ!</strong><br>คุณใช้ ${ballName} จับ <strong>${caughtName} Lv.${caughtLevel}</strong> ได้สำเร็จ!<br>ถูกเพิ่มเข้าสู่คลังสัตว์เลี้ยงแล้ว`,
          'success'
        );
      } else {
        // จับพลาด
        saveGame();
        updateUI();

        const fleeRoll = Math.random() * 100;
        if (fleeRoll < 35) {
          const fleeName = wildPokemon.name;
          wildPokemon = null;
          renderCatchScreen(
            `💨 <strong>จับพลาด!</strong><br>${fleeName} ดิ้นหลุดออกมาและวิ่งหนีหายไปแล้ว!`,
            'error'
          );
        } else {
          renderCatchScreen(
            `💨 <strong>จับพลาด!</strong><br>${wildPokemon.name} Lv.${wildPokemon.level} ดิ้นหลุดออกมาได้! สามารถลองโยนบอลใหม่ได้`,
            'error'
          );
        }
      }
    }

    function fleeEncounter() {
      wildPokemon = null;
      renderCatchScreen('คุณวิ่งหนีออกมาอย่างปลอดภัย<br>สามารถกดสุ่มหาโปเกมอนป่าตัวใหม่ได้');
    }

    // แสดงผลหน้าจอสถานที่จับสัตว์เลี้ยง
    function renderCatchScreen(statusMessage = null, alertType = null) {
      updateUI();
      const area = document.getElementById('catch-interactive-area');
      const titleElem = document.getElementById('screen-title');
      const msgElem = document.getElementById('screen-message');

      // 1. ถ้ายังไม่ได้เลือกโซน -> แสดงปุ่มเลือก 4 โซน
      if (!currentCatchZone) {
        titleElem.textContent = '4. สถานที่จับสัตว์เลี้ยง (เลือกโซน)';
        msgElem.innerHTML = 'กรุณาเลือกโซนพื้นที่ที่คุณต้องการออกสำรวจและจับสัตว์เลี้ยง:';

        let zoneButtonsHtml = '';
        Object.keys(CATCH_ZONES).forEach(key => {
          const zone = CATCH_ZONES[key];
          zoneButtonsHtml += `
            <button class="btn" onclick="selectCatchZone('${zone.id}')">
              <div class="shop-item-info">
                <span class="shop-item-name">${zone.icon} ${zone.name}</span>
                <span class="shop-item-sub">${zone.desc}</span>
              </div>
              <span class="badge-money" style="background:#1e293b; color:#38bdf8; border-color:#38bdf8; white-space:nowrap;">
                ${zone.badgeText}
              </span>
            </button>
          `;
        });

        area.innerHTML = zoneButtonsHtml;
        return;
      }

      // 2. ถ้าเลือกโซนแล้ว
      const zone = CATCH_ZONES[currentCatchZone];
      titleElem.textContent = `4. ${zone.shortName}`;

      if (statusMessage) {
        msgElem.innerHTML = statusMessage;
      } else {
        msgElem.innerHTML = `
          ${zone.icon} กำลังสำรวจ <strong>${zone.name}</strong><br>
          กดปุ่มด้านล่างเพื่อเริ่มค้นหาโปเกมอนป่าในโซนนี้
        `;
      }

      if (alertType) {
        showAlert(alertType === 'success' ? 'จับสัตว์เลี้ยงสำเร็จ!' : 'จับพลาด!', alertType);
      }

      area.innerHTML = '';
      const inv = playerData.inventory || {};
      const totalBalls = (inv.pokeball || 0) + (inv.greatball || 0) + (inv.ultraball || 0);

      // ถ้ายังไม่เจอโปเกมอนป่า
      if (!wildPokemon) {
        area.innerHTML = `
          <button class="btn btn-search-wild" onclick="searchWildPokemonInZone()">
            <span>${zone.icon} สุ่มหาโปเกมอนป่าในโซนนี้</span>
            <span>&rarr;</span>
          </button>
          <button class="btn btn-secondary" onclick="returnToZoneSelection()">
            🗺️ เปลี่ยนโซนพื้นที่
          </button>
        `;
        return;
      }

      // ถ้ากำลังเจอโปเกมอนป่า
      let buttonsHtml = '';
      if (totalBalls === 0) {
        buttonsHtml = `
          <div class="content-box" style="color: #ef4444; border-color: #ef4444;">
            คุณไม่มี Pokeball เหลืออยู่ในกระเป๋าเลย!
          </div>
          <button class="btn btn-secondary" onclick="openMenu('shop')">
            ไปที่ร้านค้าเพื่อซื้อบอล
          </button>
          <button class="btn btn-secondary" onclick="fleeEncounter()">
            วิ่งหนี
          </button>
        `;
      } else {
        buttonsHtml = `
          <button class="btn btn-catch-action" onclick="throwBall('pokeball')" ${(inv.pokeball || 0) <= 0 ? 'disabled' : ''}>
            <span>โยน Pokeball ธรรมดา</span>
            <span class="btn-tag">เหลือ: ${inv.pokeball || 0} ลูก</span>
          </button>

          <button class="btn btn-catch-action" onclick="throwBall('greatball')" ${(inv.greatball || 0) <= 0 ? 'disabled' : ''}>
            <span>โยน Great Ball</span>
            <span class="btn-tag">เหลือ: ${inv.greatball || 0} ลูก</span>
          </button>

          <button class="btn btn-catch-action" onclick="throwBall('ultraball')" ${(inv.ultraball || 0) <= 0 ? 'disabled' : ''}>
            <span>โยน Ultra Ball</span>
            <span class="btn-tag">เหลือ: ${inv.ultraball || 0} ลูก</span>
          </button>

          <button class="btn btn-secondary" onclick="fleeEncounter()">
            🏃 วิ่งหนี / หาตัวใหม่
          </button>
        `;
      }

      area.innerHTML = buttonsHtml;
    }

    // --- ฟังก์ชันลานประลอง (ปุ่มที่ 5 - สู้ผู้เล่นจริง Matchmaking & คำนวณสรุปผลทันทีแบบมินิมอล) ---

    function selectChampion(petId) {
      selectedChampionId = petId;
      matchedOpponent = null;
      renderArenaScreen();
    }

    function changeChampion() {
      cancelMatchmaking();
      selectedChampionId = null;
      matchedOpponent = null;
      renderArenaScreen();
    }

    function cancelMatchmaking() {
      if (matchmakingTimer) {
        clearTimeout(matchmakingTimer);
        matchmakingTimer = null;
      }
      matchedOpponent = null;
    }

    // เริ่มระบบ Matchmaking ค้นหาคู่ต่อสู้ออนไลน์
    function startMatchmaking() {
      const champion = petInventory.find(p => p.id === selectedChampionId);
      if (!champion) return;

      const area = document.getElementById('arena-interactive-area');
      const titleElem = document.getElementById('screen-title');
      const msgElem = document.getElementById('screen-message');

      titleElem.textContent = '5. ลานประลอง (กำลังค้นหาคู่ต่อสู้...)';
      msgElem.innerHTML = `
        📡 กำลังเชื่อมต่อ Server Matchmaking...<br>
        ค้นหาเทรนเนอร์ที่มีระดับพลังสูสีกับ <strong>${champion.name} Lv.${champion.level}</strong>
      `;

      area.innerHTML = `
        <div class="matchmaking-card">
          <div class="pulse-text">🔍 กำลังค้นหาคู่ต่อสู้ในระบบออนไลน์...</div>
          <div style="font-size:0.85rem; color:#94a3b8;">เซิร์ฟเวอร์: Asia-East (Ranked Match)</div>
        </div>
        <button class="btn btn-secondary" onclick="renderArenaScreen()">
          ❌ ยกเลิกการค้นหา
        </button>
      `;

      // จำลองค้นหาห้อง 1.5 วินาที
      cancelMatchmaking();
      matchmakingTimer = setTimeout(() => {
        completeMatchmaking(champion);
      }, 1500);
    }

    // Matchmaking สำเร็จ -> พบคู่ต่อสู้
    function completeMatchmaking(champion) {
      const randomTrainer = SIMULATED_PLAYERS[Math.floor(Math.random() * SIMULATED_PLAYERS.length)];

      // สุ่มสัตว์เลี้ยงของฝ่ายตรงข้าม (เลเวลสูสี +/- 1)
      const oppLevel = Math.max(1, champion.level + Math.floor(Math.random() * 3) - 1);
      const elementsList = ['ไฟ', 'น้ำ', 'พืช', 'ไฟฟ้า', 'หิน'];
      const oppElement = elementsList[Math.floor(Math.random() * elementsList.length)];
      const oppWeakness = ELEMENT_WEAKNESS[oppElement] || 'น้ำ';

      const oppNames = ['ไฟมังกร', 'จิ้งจอกเพลิง', 'เต่าคลื่นวารี', 'โกเลมหินผา', 'หนูสายฟ้าฟาด', 'เถาวัลย์พฤกษา'];
      const oppName = oppNames[Math.floor(Math.random() * oppNames.length)];

      const oppAtk = oppLevel * 5 + Math.floor(Math.random() * 8) + 12;
      const oppHp = oppLevel * 8 + Math.floor(Math.random() * 12) + 25;

      matchedOpponent = {
        trainerName: randomTrainer.trainerName,
        trainerRank: randomTrainer.rank,
        trainerGuild: randomTrainer.guild,
        name: oppName,
        level: oppLevel,
        element: oppElement,
        weakness: oppWeakness,
        atk: oppAtk,
        hp: oppHp
      };

      const titleElem = document.getElementById('screen-title');
      const msgElem = document.getElementById('screen-message');
      const area = document.getElementById('arena-interactive-area');

      titleElem.textContent = '5. ลานประลอง (พบคู่ต่อสู้แล้ว!)';
      msgElem.innerHTML = `
        ⚔️ <strong>พบคู่ต่อสู้ออนไลน์แล้ว!</strong><br>
        เทรนเนอร์: <strong>${matchedOpponent.trainerName}</strong> (${matchedOpponent.trainerRank})
      `;

      area.innerHTML = `
        <div class="vs-match-card">
          <div class="vs-duelists">
            <div class="duelist-col">
              <span class="duelist-trainer">คุณ</span>
              <span class="duelist-pet">${champion.name}</span>
              <span class="btn-tag">Lv.${champion.level} (ธาตุ${champion.element})</span>
            </div>
            <div class="vs-badge">VS</div>
            <div class="duelist-col">
              <span class="duelist-trainer">${matchedOpponent.trainerName}</span>
              <span class="duelist-pet">${matchedOpponent.name}</span>
              <span class="btn-tag">Lv.${matchedOpponent.level} (ธาตุ${matchedOpponent.element})</span>
            </div>
          </div>
          <div style="font-size:0.8rem; color:#ef4444; font-weight:700;">
            ⚠️ กฎ Permadeath: สัตว์เลี้ยงที่ HP หมดจะตายและถูกลบถาวร!
          </div>
        </div>

        <button class="btn btn-arena-start" onclick="executeOnlineBattle()">
          <span>⚔️ เริ่มการต่อสู้เดี๋ยวนี้!</span>
          <span>&rarr;</span>
        </button>
        <button class="btn btn-secondary" onclick="changeChampion()">
          🏃 ถอยทัพ / สละสิทธิ์
        </button>
      `;
    }

    // คำนวณผลการต่อสู้ทันทีหลังบ้านแบบไม่มี Log (Fast & Minimal Result)
    function executeOnlineBattle() {
      const champion = petInventory.find(p => p.id === selectedChampionId);
      if (!champion || !matchedOpponent) {
        changeChampion();
        return;
      }

      const opponent = matchedOpponent;

      // คำนวณความได้เปรียบธาตุ
      let playerMultiplier = 1.0;
      if (champion.element === opponent.weakness) {
        playerMultiplier = 1.45;
      } else if (opponent.element === champion.weakness) {
        playerMultiplier = 0.8;
      }

      let enemyMultiplier = 1.0;
      if (opponent.element === champion.weakness) {
        enemyMultiplier = 1.45;
      } else if (champion.element === opponent.weakness) {
        enemyMultiplier = 0.8;
      }

      let playerHp = champion.hp;
      let enemyHp = opponent.hp;

      // จำลองการต่อสู้หลังบ้านทันทีโดยไม่มี Log
      let round = 1;
      while (playerHp > 0 && enemyHp > 0 && round <= 30) {
        const pDamage = Math.max(1, Math.floor(champion.atk * playerMultiplier + (Math.random() * 4 - 2)));
        enemyHp -= pDamage;
        if (enemyHp <= 0) break;

        const eDamage = Math.max(1, Math.floor(opponent.atk * enemyMultiplier + (Math.random() * 4 - 2)));
        playerHp -= eDamage;
        round++;
      }

      // ตัดสินผลแพ้-ชนะทันทีแบบสรุปสั้น
      if (enemyHp <= 0) {
        // --- ชนะ (Victory) ---
        const rewardMoney = Math.floor(opponent.level * 100 + 150);
        playerData.money += rewardMoney;

        saveGame();
        updateUI();

        const victoryMsg = `
          🎉 <strong>ชนะการประลอง!</strong><br>
          คุณเอาชนะ ${opponent.trainerName} ได้สำเร็จ!<br>
          <span style="color:#fbbf24; font-weight:800; font-size:1.15rem;">💰 ได้รับเงินรางวัล +${rewardMoney.toLocaleString()} G</span>
        `;
        renderArenaScreen(victoryMsg);
        showAlert(`ชนะการประลอง! ได้รับ +${rewardMoney} G`, 'success');
      } else {
        // --- แพ้ (Permadeath) ---
        const champName = champion.name;
        const champIndex = petInventory.findIndex(p => p.id === champion.id);

        // ลบสัตว์เลี้ยงออกจาก petInventory ถาวร
        if (champIndex !== -1) {
          petInventory.splice(champIndex, 1);
        }
        selectedChampionId = null;
        matchedOpponent = null;

        saveGame();
        updateUI();

        const defeatMsg = `
          💀 <strong>แพ้การประลอง!</strong><br>
          <span style="color:#ef4444; font-weight:800; font-size:1.05rem;">
            ⚠️ สัตว์เลี้ยงของคุณ (${champName}) เสียชีวิตถาวรและถูกลบออกจากคลัง
          </span>
        `;
        renderArenaScreen(defeatMsg);
        showAlert(`แพ้การประลอง! ${champName} เสียชีวิตถาวร`, 'error');
      }
    }

    // เรนเดอร์หน้าจอลานประลอง
    function renderArenaScreen(customSummaryMessage = null) {
      updateUI();
      const area = document.getElementById('arena-interactive-area');
      const titleElem = document.getElementById('screen-title');
      const msgElem = document.getElementById('screen-message');

      titleElem.textContent = '5. ลานประลอง (สู้ผู้เล่นจริง)';

      if (petInventory.length === 0) {
        msgElem.innerHTML = `
          <span style="color:#f87171; font-weight:700;">ไม่มีสัตว์เลี้ยงในคลัง!</span><br>
          คุณไม่มีสัตว์เลี้ยงสำหรับลงประลอง กรุณาไปจับสัตว์เลี้ยงก่อน
        `;
        area.innerHTML = `
          <button class="btn btn-secondary" onclick="openMenu('catch')">
            ไปที่สถานที่จับสัตว์เลี้ยง
          </button>
        `;
        return;
      }

      const champion = petInventory.find(p => p.id === selectedChampionId);

      // กรณีแสดงหน้าจอสรุปผลสั้นๆ ทันที
      if (customSummaryMessage) {
        msgElem.innerHTML = customSummaryMessage;
        area.innerHTML = `
          ${champion ? `
            <button class="btn btn-arena-start" onclick="startMatchmaking()">
              <span>🌐 หาคู่ต่อสู้คนต่อไป (Matchmaking)</span>
              <span>&rarr;</span>
            </button>
            <button class="btn btn-secondary" onclick="changeChampion()">
              🔄 เปลี่ยนตัวแทน
            </button>
          ` : `
            <button class="btn btn-secondary" onclick="changeChampion()">
              ⚔️ เลือกตัวแทนตัวใหม่
            </button>
          `}
          <button class="btn btn-secondary" onclick="goBack()">
            🔙 กลับสู่หน้าหลัก
          </button>
        `;
        return;
      }

      // ถ้ายังไม่ได้เลือกตัวแทน -> แสดงรายชื่อในคลัง
      if (!champion) {
        msgElem.innerHTML = `
          <span style="color:#f87171; font-weight:700;">⚠️ กฎ Permadeath: แพ้แล้วตายถาวร!</span><br>
          กรุณาเลือก 1 ตัวแทนจากคลัง เพื่อส่งลงสนามแข่งออนไลน์:
        `;

        let listHtml = '<div class="inventory-scroll">';
        petInventory.forEach(pet => {
          listHtml += `
            <div class="pet-card">
              <div class="pet-info">
                <div class="pet-name-line">
                  <span>${pet.name}</span>
                  <span class="btn-tag">ธาตุ${pet.element}</span>
                </div>
                <div class="pet-stat-line">
                  เลเวล: ${pet.level}, ธาตุ: ${pet.element}, ATK: ${pet.atk}, HP: ${pet.hp}, แพ้ทาง: ${pet.weakness}
                </div>
              </div>
              <div class="pet-action-row">
                <button class="btn-choose-champ" onclick="selectChampion(${pet.id})">
                  ⚔️ เลือกตัวนี้ลงแข่ง
                </button>
              </div>
            </div>
          `;
        });
        listHtml += '</div>';

        area.innerHTML = listHtml;
        return;
      }

      // ถ้าเลือกตัวแทนแล้ว -> แสดงปุ่มเริ่ม Matchmaking
      msgElem.innerHTML = `
        <strong>🛡️ ตัวแทนของคุณ: ${champion.name} Lv.${champion.level}</strong><br>
        ธาตุ: ${champion.element} | ATK: ${champion.atk} | HP: ${champion.hp}<br>
        <span style="color:#94a3b8; font-size:0.86rem;">พร้อมเข้าสู่ระบบค้นหาคู่ต่อสู้แบบออนไลน์!</span>
      `;

      area.innerHTML = `
        <button class="btn btn-arena-start" onclick="startMatchmaking()">
          <span>🌐 ค้นหาคู่ต่อสู้ออนไลน์ (Matchmaking)</span>
          <span>&rarr;</span>
        </button>
        <button class="btn btn-secondary" onclick="changeChampion()">
          🔄 เปลี่ยนตัวแทน
        </button>
      `;
    }

    // --- ระบบนำทางหน้าจอ (Screen Switching) ---
    function openMenu(menuType) {
      currentScreen = menuType;
      document.getElementById('alert-box').innerHTML = '';
      cancelMatchmaking();

      document.getElementById('panel-main').style.display = 'none';
      document.getElementById('panel-shop').style.display = 'none';
      document.getElementById('panel-petshop').style.display = 'none';
      document.getElementById('panel-inventory').style.display = 'none';
      document.getElementById('panel-catch').style.display = 'none';
      document.getElementById('panel-arena').style.display = 'none';

      const titleElem = document.getElementById('screen-title');
      const msgElem = document.getElementById('screen-message');

      switch (menuType) {
        case 'shop':
          titleElem.textContent = '1. ร้านค้า';
          msgElem.innerHTML = 'ยินดีต้อนรับสู่ร้านค้า Pokeball!<br>แตะปุ่มเพื่อซื้อไอเทมที่ต้องการ';
          document.getElementById('panel-shop').style.display = 'flex';
          renderShop();
          break;

        case 'petshop':
          titleElem.textContent = '2. ร้านสัตว์เลี้ยง';
          msgElem.innerHTML = 'ยินดีต้อนรับสู่ร้านอาหารสัตว์เลี้ยง!<br>เลือกซื้ออาหารตามธาตุเพื่อเพิ่มเลเวลสัตว์เลี้ยงของคุณ';
          document.getElementById('panel-petshop').style.display = 'flex';
          renderPetShop();
          break;

        case 'inventory':
          titleElem.textContent = '3. คลังสัตว์เลี้ยง';
          msgElem.innerHTML = `รายการสัตว์เลี้ยงทั้งหมดในครอบครอง (${petInventory.length} ตัว)<br>กดปุ่มให้อาหารเพื่อเพิ่มเลเวลหรือขายเพื่อรับเหรียญ`;
          document.getElementById('panel-inventory').style.display = 'flex';
          renderInventory();
          break;

        case 'catch':
          document.getElementById('panel-catch').style.display = 'flex';
          renderCatchScreen();
          break;

        case 'arena':
          document.getElementById('panel-arena').style.display = 'flex';
          renderArenaScreen();
          break;

        default:
          goBack();
          return;
      }

      updateUI();
    }

    // ย้อนกลับสู่หน้าจอหลัก
    function goBack() {
      currentScreen = 'main';
      document.getElementById('alert-box').innerHTML = '';
      cancelMatchmaking();

      document.getElementById('panel-main').style.display = 'flex';
      document.getElementById('panel-shop').style.display = 'none';
      document.getElementById('panel-petshop').style.display = 'none';
      document.getElementById('panel-inventory').style.display = 'none';
      document.getElementById('panel-catch').style.display = 'none';
      document.getElementById('panel-arena').style.display = 'none';

      document.getElementById('screen-title').textContent = 'หน้าหลัก';
      document.getElementById('screen-message').innerHTML = 'ยินดีต้อนรับสู่ Monster Quest!<br>กรุณาเลือกเมนูที่ต้องการทำรายการ';

      updateUI();
    }

    // เริ่มต้นทำงานเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', () => {
      loadGame();
    });
  </script>
</body>
